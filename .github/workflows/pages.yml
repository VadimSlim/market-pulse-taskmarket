name: Refresh and deploy Market Pulse
on:
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: market-pulse-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install image dependency
        run: python -m pip install -r requirements.txt
      - name: Refresh data
        run: python refresh.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
